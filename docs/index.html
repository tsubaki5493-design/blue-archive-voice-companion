    * { box-sizing: border-box; }
    body {
      margin: 0;

      font-family: "Malgun Gothic", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #F3F5F8;
      color: #1E293B;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      width: 100%;
      background: #FB7390;
      color: #FFFFFF;
      padding: 16px 20px;
      text-align: center;
      box-shadow: 0 2px 10px rgba(251, 115, 144, 0.25);
    }
    header h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
    }
    header p {
      margin: 6px 0 0;
      font-size: 0.9rem;
      color: #FFF1F4;
    }
    main {
      width: 100%;
      max-width: 1020px;
      padding: 24px 16px 40px;
    }
    .card {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }
    video {
      width: 100%;
      height: auto;
      border-radius: 10px;
      background: #0F172A;
      display: block;
    }
    .caption {
      margin: 12px 4px 0;
      font-size: 0.9rem;
      color: #475569;
      line-height: 1.5;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 11px 18px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }
    .btn:hover { opacity: 0.92; transform: translateY(-1px); }
    .btn-primary { background: #FB7390; color: #FFFFFF; }
    .btn-secondary { background: #E2E8F0; color: #1E293B; }
